<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 320px; font-family: Arial, sans-serif; padding: 12px; margin: 0; background: #111217; color: #e3e3e3; }
        h3 { margin-top: 0; color: #47b970; border-bottom: 1px solid #2d3139; padding-bottom: 6px; }
        button { width: 100%; background: #47b970; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-bottom: 12px; }
        button:hover { background: #3fa563; }
        .section { margin-bottom: 12px; padding: 8px; background: #1c1e24; border-radius: 4px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
        .total { font-weight: bold; border-top: 1px dashed #3a3f4d; margin-top: 6px; padding-top: 6px; }
        .green { color: #47b970; }
        .red { color: #ea4335; }
        .pct { color: #888; font-size: 11px; }
    </style>
</head>
<body>
<h3>HL Strategy Analyzer</h3>
<button id="analyzeBtn">📊 Анализировать позиции</button>
<div id="results">Нажмите кнопку, находясь на вкладке Trade на Hyperliquid.</div>

<script src="popup.js"></script>
</body>
</html>
